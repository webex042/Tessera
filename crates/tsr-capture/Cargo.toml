[package]
name = "tsr-capture"
description = "Tessara capture: state gates, cadence, UIA text, WGC frames, Windows OCR"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tsr-core = { path = "../tsr-core" }
tsr-guard = { path = "../tsr-guard" }
tsr-store = { path = "../tsr-store" }
rusqlite.workspace = true
zeroize.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
tsr-win = { path = "../tsr-win" }
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
